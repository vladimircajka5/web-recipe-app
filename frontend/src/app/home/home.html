<h1>Discover recipes</h1>

<div class="feed-selector" role="group" aria-label="Recipe feed">
  <button type="button" [attr.aria-pressed]="feed() === 'popular'" (click)="feed.set('popular')">
    Popular
  </button>
  <button type="button" [attr.aria-pressed]="feed() === 'newest'" (click)="feed.set('newest')">
    Newest
  </button>
</div>

<section class="recipe-grid" aria-label="Recipes">
  @for (recipe of recipes(); track recipe.id) {
    <app-recipe-card [recipe]="recipe" [publishedAt]="recipe.creationDate"/>
  }
</section>
