spring.application.name=recipes

# PostgreSQL database connection
spring.datasource.url=jdbc:postgresql://localhost:5432/recipes_db
spring.datasource.username=recipes_user
spring.datasource.password=${DB_PASSWORD}

# Hibernate database schema management
spring.jpa.hibernate.ddl-auto=update


spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:db/seed.sql
